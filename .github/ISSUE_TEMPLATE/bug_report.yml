name: Bug report
description: Report a reproducible problem in the lab.
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include seed, preset, tick, controls, and a sanitized checkpoint if relevant.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit or version, OS, browser, Node version or Docker version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and private paths before uploading.
